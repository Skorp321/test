services:

  yolo-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yolo-app
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - DISPLAY=${DISPLAY}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - $PWD/src/visualize/infer_trt.py:/app/infer_trt.py
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    stdin_open: true
    tty: true
    devices:
      - /dev/video0:/dev/video0

    network_mode: host
    privileged: true 
    command: python3 /app/infer_trt.py
    restart: unless-stopped